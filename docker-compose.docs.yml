version: "3.8"

services:
  docs:
    build: .
    container_name: mcp-docs-server
    restart: unless-stopped
    expose:
      - "80"

  tailscale-docs:
    image: tailscale/tailscale:latest
    container_name: tailscale-docs
    restart: unless-stopped
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_EXTRA_ARGS=--hostname=mcp-docs
    volumes:
      - mcp-docs-ts-data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    depends_on:
      - docs
    ports:
      - "80:80"

volumes:
  mcp-docs-ts-data:
