name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install project and release dependencies
        run: python -m pip install -e ".[dev,release]"
      - name: Validate release metadata
        run: python -m pytest tests/test_release_assets.py -q
      - name: Build release assets
        run: python scripts/build_release.py
      - name: Publish GitHub release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem dist -File | Sort-Object Name | ForEach-Object FullName)
          if ($assets.Count -ne 7) {
            throw "Expected 7 release assets, found $($assets.Count)"
          }
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "MusicBee Tagger MCP $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
