name: Publish Release

on:
  push:
    branches: [master]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install project and release dependencies
        run: python -m pip install -e ".[dev,release]"
      - name: Validate release metadata
        run: python -m pytest tests/test_release_assets.py -q
      - name: Build release assets
        run: python scripts/build_release.py
      - name: Publish GitHub release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF_NAME -eq "master") {
            $tag = "nightly"
            # Delete existing nightly release/tag if it exists to keep rolling nightly
            git tag -d nightly 2>$null
            git push origin :refs/tags/nightly 2>$null
            gh release delete nightly --yes 2>$null
            git tag nightly
            git push origin nightly
            $refName = "nightly"
            $title = "MusicBee Tagger MCP Nightly Build"
            $prerelease = "--prerelease"
          } else {
            $refName = $env:GITHUB_REF_NAME
            $title = "MusicBee Tagger MCP $env:GITHUB_REF_NAME"
            $prerelease = ""
          }

          $assets = @(Get-ChildItem dist -File | Sort-Object Name | ForEach-Object FullName)
          if ($assets.Count -lt 6) {
            throw "Expected at least 6 release assets, found $($assets.Count)"
          }
          gh release create $refName @assets --verify-tag --title $title --generate-notes $prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
