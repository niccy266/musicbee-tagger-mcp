name: Repo Health

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 3 * * 1"   # weekly dependency audit

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg (test fixtures)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        if: matrix.python-version != '3.12'
        run: python -m pytest -q
      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: python -m pytest -q --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Pylint errors fail the build
        run: python -m pylint --recursive=y --errors-only src

  lint-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Pylint score (report only)
        run: python -m pylint --recursive=y --exit-zero src

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --strict

  windows-mcpb:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install project and Windows packaging dependencies
        run: python -m pip install -e ".[dev,release]"
      - name: Build and smoke-test the Claude Desktop Windows bundle
        run: python -m pytest tests/test_windows_mcpb.py -q
