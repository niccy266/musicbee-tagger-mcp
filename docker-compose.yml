# MusicBee Tagger MCP behind a Tailscale sidecar.
# Public internet access is opt-in: after startup, enable Funnel with:
#   docker compose exec tailscale tailscale funnel --bg --https=443 https+insecure://127.0.0.1:8443
# The HTTPS MCP endpoint requires MCP_AUTH_TOKEN as a Bearer token.

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: musicbee-tailscale
    hostname: musicbee-mcp
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?Set TS_AUTHKEY in .env}
      TS_STATE_DIR: /var/lib/tailscale
    volumes:
      - tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      # Optional local access; internet access is provided by Tailscale Funnel.
      - "127.0.0.1:${MCP_HTTPS_PORT:-8443}:8443"

  musicbee-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: musicbee-mcp
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
      - musicbee-apply
    environment:
      MUSICBEE_TAGGER_DATA_DIR: /data
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8443"
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in .env}
      SECRET_COMMAND_TOKEN: ${SECRET_COMMAND_TOKEN:-changeme}
    volumes:
      - ${MUSICBEE_AUDIO_DIR:-./audio}:/audio:ro
      - musicbee-staging:/staging:rw
      - musicbee-data:/data:rw
      - musicbee-certs:/certs:rw
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
      - /run:noexec,nosuid,size=10m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true

  musicbee-apply:
    build:
      context: .
      dockerfile: Dockerfile.apply
    container_name: musicbee-apply
    restart: "no"
    environment:
      MUSICBEE_TAGGER_DATA_DIR: /data
    volumes:
      - ${MUSICBEE_AUDIO_DIR:-./audio}:/audio:rw
      - musicbee-staging:/staging:ro
      - musicbee-data:/data:rw
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
      - /run:noexec,nosuid,size=10m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    networks:
      - musicbee-internal

volumes:
  musicbee-staging:
  musicbee-data:
  musicbee-certs:
  tailscale-state:

networks:
  musicbee-internal:
    driver: bridge
