[project]
name = "musicbee-tagger-mcp"
version = "0.4.5"
description = "MCP bridge for MusicBee audio metadata, forensic album resolution, and scrobble optimization"
readme = "README.md"
requires-python = ">=3.11, <4.0"
dependencies = [
    "mcp>=2.0.0",
    "mutagen>=1.47.0",
    "musicbrainzngs>=0.7.1",
    "ftfy>=6.2.0",
    "openai>=1.40.0",
    "tabulate[widechars]>=0.9.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "pylint>=3.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "pymdown-extensions>=10.0",
]
release = [
    "build>=1.2.2",
    "pyinstaller>=6.15.0",
]

[project.scripts]
musicbee-tagger-mcp = "musicbee_tagger_mcp.server:main"
musicbee-tagger-apply = "musicbee_tagger_mcp.apply_staged:main"
musicbee-tagger-register-playlist = "musicbee_tagger_mcp.register_playlist_cli:main"
musicbee-tagger-clear-registrations = "musicbee_tagger_mcp.clear_registrations_cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers --timeout=120 -W error::DeprecationWarning:musicbee_tagger_mcp"
timeout = 120
filterwarnings = ["error::DeprecationWarning:musicbee_tagger_mcp"]
markers = [
    "network: allow network access in this test",
    "slow: slow-running test",
    "windows: Windows-only test",
    "requires_audio_fixtures: requires committed audio fixtures and ffmpeg",
]

[tool.uv]
cache-dir = ".uv-cache"


[tool.coverage.run]
source = ["musicbee_tagger_mcp"]

[tool.coverage.report]
exclude_lines = [
    'if __name__ == "__main__":',
]
show_missing = true
# Temporary floor, not a quality target. Several modules reached master through
# merges without unit tests (lastfm.py 572 stmts, job_store.py 1212,
# genre_cleanup.py 129), which took the real number from ~73 to 56. Ratchet this
# back up as tests land; do not lower it further.
fail_under = 56
